pus6_motor_driver_node:
  ros__parameters:
    port: "/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0"
    baudrate: 921600
    timeout: 0.05
    poll_rate_hz: 50.0
    hardware_mode: "mock"  # "mock" | "read_only" | "active"
    auto_connect: true
    auto_configure: false
    speed: 50
    mode: 2
    max_current_mA: 500
    motor_ids: [1, 2, 3, 4, 5, 6]
    maintenance_mode: false
