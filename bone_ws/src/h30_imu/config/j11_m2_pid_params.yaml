# J11-M2: Dual-IMU Task-Space Attitude PID Residual Stabilization Parameters
# Stage: J11-M2-6 3DOF PD (Feedforward + PD Attitude Residual Stabilization)
# Note: Retained P baseline Kp = [0.05, 0.05, 0.025], max_residual = 0.5 deg; Ki = 0, Kd = 0 initial baseline.

j11_m2_attitude_pid:
  ros__parameters:
    # 3-Axis Proportional Gains [dimensionless rad_out/rad_err]
    # Retained Best Tested P-Only Baseline: Kp = [0.05, 0.05, 0.025]
    kp_roll: 0.05
    kp_pitch: 0.05
    kp_yaw: 0.025

    # 3-Axis Integral Gains [1/s^2] (strictly 0.0 in M2-6)
    ki_roll: 0.0
    ki_pitch: 0.0
    ki_yaw: 0.0

    # 3-Axis Derivative Gains [s]
    # Retained Working Baseline: Kd = [0.0, 0.0, 0.0015] s
    kd_roll: 0.0
    kd_pitch: 0.0
    kd_yaw: 0.0015

    # Derivative Control & LPF Configuration
    derivative_enabled: true
    derivative_lpf_cutoff_hz: 5.0

    # Output Residual Saturation Limits (per axis, degrees)
    # Small task-space correction budget; DOES NOT restrict geometric workspace
    max_residual_roll_deg: 0.5
    max_residual_pitch_deg: 0.5
    max_residual_yaw_deg: 0.5

    # Integrator Clamping Limits (per axis, degrees * s)
    max_integral_roll_deg_s: 2.0
    max_integral_pitch_deg_s: 2.0
    max_integral_yaw_deg_s: 4.0

    # Loop timing & freshness bounds
    control_rate_hz: 50.0
    min_dt_s: 0.001
    max_dt_s: 0.100
    max_platform_imu_age_s: 0.100
    max_base_imu_age_s: 0.100

# Low-level driver & kinematics parameters retained from qualified M1 baseline
pus6_motor_driver_node:
  ros__parameters:
    port: "/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0"
    baudrate: 921600
    timeout: 0.05
    write_rate_hz: 50.0
    poll_rate_hz: 10.0
    hardware_mode: "mock"
    auto_connect: true
    auto_configure: false
    speed: 50
    mode: 2
    max_current_mA: 500
    motor_ids: [1, 2, 3, 4, 5, 6]
    maintenance_mode: true
    reconnect_max_jump_steps: 80
    feedback_loss_policy: "age_based"

pus6_kinematics_node:
  ros__parameters:
    envelope_max_xy_m: 0.045
    envelope_max_z_delta_m: 0.025
    envelope_max_angle_rad: 1.50
    enforce_software_envelope: false

pus6_control_node:
  ros__parameters:
    control_rate_hz: 50.0
    max_speed_m_per_sec: 0.005
    max_accel_m_per_sec2: 0.050
    max_jerk_m_per_sec3: 0.500
    omega_n: 20.0
    maintenance_mode: true
