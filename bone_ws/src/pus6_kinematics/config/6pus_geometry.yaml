# 6PUS geometry/configuration contract.
#
# Values in this file are the current software reference model.  The complete
# mechanism is not assembled, so every assembly-dependent value remains
# explicitly pending final measurement/confirmation.  Do not replace pending
# fields with guessed hardware measurements.
schema_version: 1
model_id: 6pus_preassembly_software_reference
status: pending_final_assembly_confirmation
source:
  geometry_reference: hardware/调试工具/Kinematics.zip (params.m, inver.m)
  actuator_reference: current J3/J4 software contract
  final_assembly_measurement: pending

units:
  length: m
  angle: rad
  actuator_position: m
  raw_position: step

geometry:
  # Nominal analytical model values migrated from analytical_6pus.py.
