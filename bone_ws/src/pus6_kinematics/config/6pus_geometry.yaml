    - [-0.027500000000,  0.000000000000, 0.0]
    - [-0.013750000000, -0.023815698604, 0.0]
    - [ 0.013750000000, -0.023815698604, 0.0]
    - [ 0.027500000000,  0.000000000000, 0.0]
    - [ 0.013750000000,  0.023815698604, 0.0]
  confirmation:
    base_anchors: pending_final_assembly_measurement
    platform_anchors: pending_final_assembly_measurement
    strut_length: pending_final_assembly_measurement
    mounting_angles: pending_final_assembly_measurement

