  platform_radius_m: 0.027500000000
  strut_length_m: 0.084000000000
  lambda_rad: 0.5235987755982988
  mu_rad: 1.0471975511965976
  nominal_height_m: 0.13261226796206452

  # Anchor order is actuator ID 1..6.  These are model anchors, not final
  # assembled measurements.
  base_anchors_m:
    - [-0.010352761804,  0.038637033052, 0.0]
    - [-0.038637033052, -0.010352761804, 0.0]
